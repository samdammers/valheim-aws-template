name: Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      # No explicit terraform_version: an old pinned CLI release only knows
      # about HashiCorp's previous (since-rotated) provider-signing key, and
      # fails provider install with "openpgp: key expired" once that key's
      # validity window passes. Defaulting to latest keeps the trust store
      # current.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Format check
        run: terraform fmt -check -recursive

      # No backend, no AWS credentials needed for validate - it only checks
      # syntax and internal consistency against provider schemas.
      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v5

      - name: Lint
        run: tflint --init && tflint

  lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/lambda
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m py_compile manager.py
